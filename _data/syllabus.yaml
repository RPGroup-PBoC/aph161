      - title: The real secret of life.
        description: The rules of spontaneous change - an ode to the laws of thermodynamics. Defiance. Biological batteries. Case studies in life needing energy. Forming gradients. Pumping sugar up a gradient. Fidelity in biological polymerization.

- day:
  date: Week of Feb. 09 (#6)
  topics: 
      - title: Weird vectors, big data, regression, thinking big about data, etc. 
        description:  Jiggling and coupled vibrations (covariance matrices), shapes, transcriptomes, the Eigenworm as an example.
  video:
      - url: https://youtu.be/XzsdeLyZTEU?si=HScZ7-jAfkNoKypE
        title: "Representations An Introduction"
        description: One of the most profound ways in which mathematics allows us to describe the world around us is through different REPRESENTATIONS of objects, processes and concepts. This vignette provides a number of examples of such representations.
      - url: https://youtu.be/hIAi3ezzkqA?si=_QtOanqzkvjzulw9
        title: "Vectors An Introduction"
        description: The notion of vector is much broader than the simple idea of position vector we first encounter in physics. This vignette describes various generalizations of the notion of vector.
      - url: https://youtu.be/GcZDt_cY5nI?si=7XLSCmBx_CxK9zm2
       title: "The “Right” Variables and the Awesome Power of Data Collapse"
       description: This vignette describes the deep and important question of what degrees of freedom we should use in describing a given problem.  After illustrating this with several examples, we describe the notion of data collapse.
       
